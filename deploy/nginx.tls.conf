map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  server_name 114.215.182.66;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://114.215.182.66$request_uri; }
}
server {
  listen 443 ssl;
  server_name 114.215.182.66;
  ssl_certificate /etc/letsencrypt/live/114.215.182.66/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/114.215.182.66/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 25m;
  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
  }
}
