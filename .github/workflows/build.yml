name: Desktop builds
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: moye-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            test-results/*.png
